name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Coeur DSP : tests natifs (sans DeepFilterNet) + gv-cli
      - name: Tests du coeur
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGV_CORE_TESTS=ON
          cmake --build build -j
          ctest --test-dir build/core --output-on-failure

      # WASM : meme coeur, compile par Emscripten -> web/src/wasm/gv.js + gv.wasm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - name: Build WASM
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WASM = gv-cli
        run: |
          mkdir -p tmp && cd tmp
          ../build/core/test_offline ../core/presets --wav
          echo '[0.4167,1.0833]' > cuts.json
          ../build/gv-cli t2_dc.wav cli.wav --preset ../core/presets/piece-qui-resonne.json --cuts cuts.json --report cli.json
          node ../wasm/test-node.mjs t2_dc.wav cli.wav cli.json ../core/presets/piece-qui-resonne.json cuts.json

      - name: Web
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
